# Satisfactory (Windows, Steam). Unreal Engine 5.6, no anti-cheat, no Mac version.
# The first game through the Porting Kit.

name = "Satisfactory"
library = "/Volumes/SMART/SteamLibraryWindows"
steam_appid = 526870
install_dir = "Satisfactory"
exe = ""            # resolved: Engine/Binaries/Win64/FactoryGameSteam-Win64-Shipping.exe
process = ""
launch = "steam"
# Unreal's Vulkan renderer on MoltenVK: works on Wine 11 (falls back from SM6
# to SM5: MoltenVK has no mesh shaders or 64-bit atomics). Needs MoltenVK 1.4.1
# or later (wine11 installs 1.4.2) for the runtime virtual textures, which are
# written through uncompressed views of compressed images: docs/SATISFACTORY.md.
# DirectX 11 needs DXMT, which stock Wine 11 cannot load yet.
# Console variables go in -ini:Engine:[SystemSettings]:... (the shipping build
# applies it; it ignores -dpcvars):
# - r.VT.RVT.DirectCompress=0: with MoltenVK's aliased uncompressed views the
#   direct path hangs the GPU in the menu's first frames;
# - r.Shadow.CacheWholeSceneShadows=0: the cached point-light shadow copy uses
#   a geometry shader, which Metal does not have (the pipeline fails and the
#   game quits).
args = [
    "-vulkan",
    "-ini:Engine:[SystemSettings]:r.VT.RVT.DirectCompress=0,[SystemSettings]:r.Shadow.CacheWholeSceneShadows=0",
]
runtime = "wine11"

[env]
